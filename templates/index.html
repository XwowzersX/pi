<!DOCTYPE html>
<html>
<head>
    <title>π Live Stream</title>
    <style>
        body {
            background: black;
            color: lime;
            font-family: monospace;
            margin: 0;
            padding: 10px;
        }
        #counter {
            position: fixed;
            top: 0;
            right: 0;
            background: #111;
            padding: 5px 10px;
            border-left: 1px solid lime;
            border-bottom: 1px solid lime;
        }
    </style>
</head>
<body>

<div id="counter">Digits: 0</div>
<pre id="output"></pre>

<script>
const output = document.getElementById("output");
const counter = document.getElementById("counter");

const es = new EventSource("/pi");

es.onmessage = (e) => {
    if (e.data.startsWith("Digits:")) {
        counter.textContent = e.data;
    } else {
        output.textContent += e.data;
        window.scrollTo(0, document.body.scrollHeight);
    }
};
</script>

</body>
</html>
