<!DOCTYPE html>
<div id="bg"></div>

<div class="container">
    <div class="title">∞ PI REACTOR ∞</div>

    <div class="counter">
        Digits Generated: <span id="digits" class="glow">0</span>
    </div>

    <div class="buttons">
        <button onclick="savePi()">SAVE</button>
        <button onclick="readPi()">READ</button>
    </div>

    <div id="pi">Loading π...</div>
</div>

<script>
const piDiv = document.getElementById("pi");
const digitsDiv = document.getElementById("digits");

async function updatePi() {
    try {
        const res = await fetch('/pi');
        const data = await res.json();

        piDiv.textContent = data.pi;
        digitsDiv.textContent = data.digits;

        piDiv.scrollTop = piDiv.scrollHeight;
    } catch (e) {
        console.log(e);
    }
}

async function savePi() {
    const res = await fetch('/save', {
        method: 'POST'
    });

    const data = await res.json();

    alert(`Saved ${data.digits} digits into save.txt`);
}

async function readPi() {
    const res = await fetch('/read');
    const data = await res.json();

    if (data.status === 'loaded') {
        piDiv.textContent = data.pi;
        digitsDiv.textContent = data.digits;

        alert(`Loaded ${data.digits} digits from save.txt`);
    } else {
        alert('No save file found');
    }
}

setInterval(updatePi, 100);
updatePi();
</script>

</body>
</html>
